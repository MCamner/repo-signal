name: Generated examples

on:
  # Scoped to main: a bare `push:` also fires on feature branches, so a branch
  # with an open PR reports the same check name twice on one SHA, and required
  # status checks match on the name while ignoring the event. Pushes to main
  # stay post-merge verification.
  push:
    branches: [main]
  pull_request:

jobs:
  generated-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ai]"

      - name: Check generated examples
        run: |
          scripts/check-generated-examples.sh

      - name: Check skills consistency
        run: |
          scripts/check-skills.sh
