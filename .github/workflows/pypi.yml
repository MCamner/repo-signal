name: PyPI publish

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish to PyPI? Type true to publish."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  pypi-readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run PyPI readiness check
        run: |
          scripts/check-pypi-readiness.sh

  publish-pypi:
    if: inputs.publish_to_pypi
    needs: pypi-readiness
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
