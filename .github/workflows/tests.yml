name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # repo-signal produces memory-observation.v1 and repo-review.v1, which
      # mqobsidian owns. tests/test_vendored_contracts.py compares the copies in
      # schemas/vendor/ with these; only the two schema files are checked out,
      # so nothing foreign lands in a tree repo-signal inspects.
      - name: Check out canonical mqobsidian contracts
        uses: actions/checkout@v4
        with:
          repository: MCamner/mqobsidian
          ref: main
          path: .canonical/mqobsidian
          sparse-checkout: |
            schemas/memory-observation.v1.json
            schemas/repo-review.v1.json
          sparse-checkout-cone-mode: false

      - name: Run tests
        env:
          MQ_CANONICAL_MQOBSIDIAN_ROOT: ${{ github.workspace }}/.canonical/mqobsidian
        run: |
          python -m pytest tests/ -v

  # Three tests asserted the literal string "repo-signal" against output that
  # actually carries the checkout directory's name, so the suite passed only in
  # a directory that happened to be called that and failed in a git worktree.
  # Same class as the shell-discovery defect: the test read implicit machine
  # context instead of its own input. Checking out under a different name keeps
  # the acceptance criterion enforced rather than remembered.
  renamed-checkout:
    name: Suite from a renamed checkout
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository under a different directory name
        uses: actions/checkout@v4
        with:
          path: zeta-checkout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        working-directory: zeta-checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        working-directory: zeta-checkout
        run: |
          python -m pytest tests/ -v

  # scripts/check-docs-consistency.sh existed but no workflow ran it, so every
  # version surface it guards — pyproject, __version__, CHANGELOG — could drift
  # with CI still green. It checks .mq/repo-contract.json too; unrun, that gap
  # surfaced as a DRIFT verdict in mq-agent's stack gate instead of here.
  docs-consistency:
    name: Docs consistency
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Docs and version consistency
        run: ./scripts/check-docs-consistency.sh
